packages:
  - "."
# dependency behavior
dedupeDirectDeps: true

# hoisting behavior
hoist: true
shamefullyHoist: true

ignoreWorkspaceRootCheck: true

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAge: 0

# Security overrides: parents pin ranges that still resolve to vulnerable
# versions. Scoped with `parent>child` where a global bump would break another
# consumer (gray-matter needs js-yaml v3's safeLoad, mermaid pins katex ^0.18).
overrides:
  seroval: ^1.6.11
  serialize-javascript: ^7.1.3
  zod: ^4.6.7
  "mdx-bundler>uuid": ^11.1.1
  "remark-mdx-frontmatter>toml": ^5.0.1
  "gray-matter>js-yaml": ^3.15.2
  "xmlbuilder2>js-yaml": ^4.3.2
  "rehype-katex>katex": ^0.19.1
  "micromark-extension-math>katex": ^0.19.1
